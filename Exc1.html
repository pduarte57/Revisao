<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício 1 - Contador</title>
</head>
<body>
    <h1>Contador</h1>
    <h2 id="numero">0</h2>

    <button id="incrementar">Incrementar</button>
    <button id="decrementar">Decrementar</button>
    <button id="zerar">Zerar</button>

    <script>
        let numero = 0;

        const numeroTela = document.querySelector("#numero");
        const btIncrementar = document.getElementById("incrementar");
        const btDecrementar = document.getElementById("decrementar");
        const btZerar = document.getElementById("zerar");

        btIncrementar.addEventListener("click", function(){
            numero++;
            numeroTela.textContent = numero;
        });

        btDecrementar.addEventListener("click", function(){
            numero--;
            numeroTela.textContent = numero;
        });

        btZerar.addEventListener("click", function(){
            numero = 0;
            numeroTela.textContent = numero;
        });
    </script>
</body>
</html>
